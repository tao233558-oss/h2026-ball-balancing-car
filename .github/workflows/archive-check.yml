name: Archive integrity and host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source archive and Keil references
        run: python tests/verify_repository.py
      - name: Test historical binary UART protocol
        run: python h2026_uart_protocol/test_protocol.py
      - name: Test host-side controller and parser checks
        run: python tests/host_checks.py
